# Configuração da análise no SonarQube Cloud
# Confira as chaves em: SonarQube Cloud > projeto > Information
sonar.organization=mp-david
sonar.projectKey=MP-David_ic-experimento
sonar.projectName=ic-experimento

# Código-fonte e testes
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx
sonar.exclusions=src/**/*.test.js,src/**/*.test.jsx

# Cobertura gerada pelo Vitest (npm run coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.jsx,src/data.js

sonar.sourceEncoding=UTF-8
